name: Build Docset

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      docset:
        required: true
        type: string

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      docset:
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install wget
        run: |
          sudo apt-get update
          sudo apt-get -y install wget
      
      - name: Setup Go environment
        uses: actions/setup-go@v5.5.0

      - name: Install Dashing
        run: |
          mkdir bin
          export CGO_CFLAGS="-g -O2 -Wno-return-local-addr"
          export GOBIN=$(pwd)/bin
          go install github.com/technosophos/dashing@latest

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' 
      
      # Runs a set of commands using the runners shell
      - name: Create build folder and download 
        run: |
          mkdir -p build/config
          cd build
          cp -v ../config/$DOCSET/* ./config
          echo "Mirroring website..."
          chmod +x ./config/download.sh
          ./config/download.sh
          echo "Installing Python requirements..."
          pip install -r ./config/requirements.txt
          echo "Polishing content..."
          python ./config/polish.py
          mv -v ./config/dashing.json ./config/icon.png .
          rm -rf ./config
          echo "Creating docset..."
          ../bin/dashing build
          echo "Compresing docset..."
          zip -r "$(basename $DOCSET.docset).zip" $DOCSET.docset
        env:
          DOCSET: ${{ inputs.docset }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.docset }}.docset .zip
          path: ./build/${{ inputs.docset }}.docset.zip
          overwrite: true
          compression-level: 0
          if-no-files-found: error
